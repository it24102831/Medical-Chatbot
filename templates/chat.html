<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical AI Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="app-shell">
        <section class="chat-card">
            <header class="chat-header">
                <div class="brand">
                    <div class="brand-avatar" aria-hidden="true">🤖</div>
                    <div>
                        <h1>Medical AI Assistant</h1>
                        <p><span class="status-dot"></span>Online</p>
                    </div>
                </div>

                <div class="trust-pill" aria-label="Secure and private">
                    <div class="trust-icon" aria-hidden="true">🛡️</div>
                    <div>
                        <strong>Secure &amp; Private</strong>
                        <span>Your conversations are safe</span>
                    </div>
                </div>
            </header>

            <section class="chat-body" id="chat-body" aria-label="Chat messages">
                <article class="message-row message-row--bot">
                    <div class="avatar avatar--bot" aria-hidden="true">🤖</div>
                    <div class="bubble bubble--bot">
                        <p>Hello! I’m your Medical AI Assistant.</p>
                        <p>How can I help you today?</p>
                        <time>10:30 AM</time>
                    </div>
                </article>
            </section>

            <footer class="chat-footer">
                <form class="composer" id="chat-form">
                    <button class="icon-button" type="button" aria-label="Attach file" disabled>📎</button>
                    <input id="message-input" name="msg" type="text" placeholder="Type your medical question..." aria-label="Type your medical question" autocomplete="off" maxlength="2000" required>
                    <button class="send-button" id="send-button" type="submit" aria-label="Send message">➤</button>
                </form>

                <p class="disclaimer">This AI assistant does not replace professional medical advice.</p>
            </footer>
        </section>
    </main>

    <script>
        const chatForm = document.getElementById("chat-form");
        const chatBody = document.getElementById("chat-body");
        const messageInput = document.getElementById("message-input");
        const sendButton = document.getElementById("send-button");
        let inFlight = false;

        function scrollChatToBottom() {
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function createMessageRow(message, sender) {
            const row = document.createElement("article");
            row.className = `message-row message-row--${sender}`;

            if (sender === "bot") {
                const avatar = document.createElement("div");
                avatar.className = "avatar avatar--bot";
                avatar.setAttribute("aria-hidden", "true");
                avatar.textContent = "🤖";
                row.appendChild(avatar);
            }

            const bubble = document.createElement("div");
            bubble.className = `bubble bubble--${sender}`;

            const paragraph = document.createElement("p");
            paragraph.textContent = message;
            bubble.appendChild(paragraph);

            const timestamp = document.createElement("time");
            timestamp.textContent = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
            bubble.appendChild(timestamp);

            row.appendChild(bubble);
            return row;
        }

        function setSubmitting(state) {
            inFlight = state;
            sendButton.disabled = state;
            messageInput.disabled = state;
        }

        chatForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            if (inFlight) return;

            const message = messageInput.value.trim();
            if (!message) return;

            chatBody.appendChild(createMessageRow(message, "user"));
            messageInput.value = "";
            scrollChatToBottom();
            setSubmitting(true);

            try {
                const response = await fetch("/get", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ msg: message.slice(0, 2000) }),
                });

                let data;
                try {
                    data = await response.json();
                } catch (_) {
                    data = { error: "Unexpected server response." };
                }

                const botMessage = data.answer || data.error || "Sorry, I could not process the response.";
                chatBody.appendChild(createMessageRow(botMessage, "bot"));
                scrollChatToBottom();
            } catch (_) {
                chatBody.appendChild(createMessageRow("Sorry, an error occurred while connecting to the server.", "bot"));
                scrollChatToBottom();
            } finally {
                setSubmitting(false);
                messageInput.focus();
            }
        });
    </script>

</body>
</html>
